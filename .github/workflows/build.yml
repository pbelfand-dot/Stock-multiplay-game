name: SHOTGUN RALLY · test & build

# Runs on the shotgun-rally branch only (BAGHOLDERS on main has its own workflow).
on:
  push:
    branches: ["shotgun-rally"]
    tags: ["shotgun-v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
      - name: Import project
        run: ./godot --headless --path . --import || true
      - name: Run tests (compile, stages, driving, AI co-driver, 2-player both ways)
        run: GODOT=./godot tests/run_all.sh

  export:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_PROJECT: ${{ vars.ITCH_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j templates.tpz \
            templates/windows_release_x86_64.exe templates/linux_release.x86_64 \
            templates/macos.zip templates/version.txt -d "$T"
          rm templates.tpz
      - name: Export
        run: |
          ./godot --headless --path . --import || true
          mkdir -p build/windows build/linux build/macos
          ./godot --headless --path . --export-release "Windows"
          ./godot --headless --path . --export-release "Linux"
          ./godot --headless --path . --export-release "macOS"
          cd build
          (cd windows && zip -q ../ShotgunRally-Windows.zip ShotgunRally.exe)
          (cd linux && zip -q ../ShotgunRally-Linux.zip ShotgunRally.x86_64)
          cp macos/ShotgunRally.zip ShotgunRally-macOS.zip
          python3 ../tools/thin_macos.py macos/ShotgunRally.zip . ShotgunRally
          ls -la
      # One permanent download link per platform: the "shotgun-latest" release always
      # holds the newest build of this branch under the SAME file names. It's marked
      # pre-release so BAGHOLDERS' "releases/latest" link keeps pointing at BAGHOLDERS.
      - name: Update the "shotgun-latest" download
        if: github.ref == 'refs/heads/shotgun-rally'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          R="$GITHUB_REPOSITORY"
          NOTES="Always the newest SHOTGUN RALLY build.
          Mac: ShotgunRally.zip (older Intel Macs: ShotgunRally-Intel.zip). Windows / Linux zips below.
          Unzip, then right-click SHOTGUN RALLY.app -> Open the first time."
          if ! gh release view shotgun-latest --repo "$R" > /dev/null 2>&1; then
            gh release create shotgun-latest --repo "$R" --target "$GITHUB_SHA" --title "SHOTGUN RALLY - latest build" --notes "$NOTES" --prerelease --latest=false
          fi
          gh release upload shotgun-latest --repo "$R" --clobber \
            ShotgunRally.zip ShotgunRally-Intel.zip ShotgunRally-Windows.zip ShotgunRally-Linux.zip
          gh release edit shotgun-latest --repo "$R" --notes "$NOTES" --prerelease --latest=false
      # itch.io: only once the BUTLER_API_KEY secret and the ITCH_PROJECT variable
      # ("your-itch-name/shotgun-rally") are set up. See docs/ITCH.md.
      - name: Push to itch.io
        if: env.BUTLER_API_KEY != '' && env.ITCH_PROJECT != '' && github.ref == 'refs/heads/shotgun-rally'
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          V="0.1.${GITHUB_RUN_NUMBER}"
          ./butler/butler push build/ShotgunRally-Windows.zip "$ITCH_PROJECT:windows" --userversion "$V"
          ./butler/butler push build/ShotgunRally-Linux.zip "$ITCH_PROJECT:linux" --userversion "$V"
          ./butler/butler push build/ShotgunRally-macOS.zip "$ITCH_PROJECT:mac-universal" --userversion "$V"
      - name: Publish a numbered release (tags only)
        if: startsWith(github.ref, 'refs/tags/shotgun-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            build/ShotgunRally-Windows.zip
            build/ShotgunRally-macOS.zip
            build/ShotgunRally.zip
            build/ShotgunRally-Intel.zip
            build/ShotgunRally-Linux.zip
