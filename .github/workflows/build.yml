name: Test & Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
      - name: Import project
        run: ./godot --headless --path . --import || true
      - name: Run tests (compile, sim, 2-player co-op + PvP smoke)
        run: GODOT=./godot tests/run_all.sh

  export:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot + export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j templates.tpz \
            templates/windows_release_x86_64.exe templates/linux_release.x86_64 \
            templates/macos.zip templates/version.txt -d "$T"
          rm templates.tpz
      - name: Export
        run: |
          ./godot --headless --path . --import || true
          mkdir -p build/windows build/linux build/macos
          ./godot --headless --path . --export-release "Windows"
          ./godot --headless --path . --export-release "Linux"
          ./godot --headless --path . --export-release "macOS"
          cd build
          (cd windows && zip -q ../Bagholders-Windows.zip Bagholders.exe)
          (cd linux && zip -q ../Bagholders-Linux.zip Bagholders.x86_64)
          cp macos/Bagholders.zip Bagholders-macOS.zip
          python3 ../tools/thin_macos.py macos/Bagholders.zip .
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: Bagholders-Windows
          path: build/Bagholders-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bagholders-macOS
          path: build/Bagholders-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bagholders-Mac-AppleSilicon
          path: build/Bagholders-Mac-AppleSilicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bagholders-Mac-Intel
          path: build/Bagholders-Mac-Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Bagholders-Linux
          path: build/Bagholders-Linux.zip
      # One permanent download link: the "latest" release always holds the
      # newest build of main under the SAME file names (only the contents change).
      - name: Update the "latest" download (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          R="$GITHUB_REPOSITORY"
          NOTES="Always the newest BAGHOLDERS build (main @ ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')).
          Mac with an M1/M2/M3/M4 chip: Bagholders-Mac-AppleSilicon.zip - older Intel Mac: Bagholders-Mac-Intel.zip.
          Unzip, then right-click BAGHOLDERS.app -> Open the first time."
          if ! gh release view latest --repo "$R" > /dev/null 2>&1; then
            gh release create latest --repo "$R" --target "$GITHUB_SHA" --title "BAGHOLDERS - latest build" --notes "$NOTES" --latest
          fi
          gh release upload latest --repo "$R" --clobber \
            Bagholders-Mac-AppleSilicon.zip Bagholders-Mac-Intel.zip Bagholders-Windows.zip Bagholders-Linux.zip
          gh release edit latest --repo "$R" --notes "$NOTES" --latest
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Bagholders-Windows.zip
            build/Bagholders-macOS.zip
            build/Bagholders-Mac-AppleSilicon.zip
            build/Bagholders-Mac-Intel.zip
            build/Bagholders-Linux.zip
