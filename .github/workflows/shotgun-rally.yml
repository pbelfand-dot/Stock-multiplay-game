name: SHOTGUN RALLY · test & build

# SHOTGUN RALLY lives in shotgun-rally/ next to BAGHOLDERS. This workflow only runs
# when something in that folder (or this file) changes; BAGHOLDERS has build.yml.
on:
  push:
    branches: ["**"]
    tags: ["shotgun-v*"]
    paths: ["shotgun-rally/**", ".github/workflows/shotgun-rally.yml"]
  pull_request:
    paths: ["shotgun-rally/**", ".github/workflows/shotgun-rally.yml"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

defaults:
  run:
    working-directory: shotgun-rally

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45                # every test has its own limit too (run_all.sh): a hang fails with a log
    steps:
      - uses: actions/checkout@v4
        with:
          # (not the owner's source packs: gigabytes the game doesn't use; the tests and the
          # exports need only the converted assets. Blobs fetched as the checkout needs them.)
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/shotgun-rally/assets/car_packages/
            !/shotgun-rally/assets/environment_packages/user_sources/
      - name: Install Godot (outside the project folder)
        run: |
          curl -sSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
      - name: Import project
        run: '"$RUNNER_TEMP/godot" --headless --path . --import || true'
      - name: Run tests (compile, stages, driving, ride, AI co-driver, 2-player both ways, updater)
        run: GODOT="$RUNNER_TEMP/godot" tests/run_all.sh

  export:
    needs: test
    runs-on: ubuntu-latest
    # one export per branch at a time, so an older build never lands after a newer one
    concurrency:
      group: shotgun-rally-export-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_PROJECT: ${{ vars.ITCH_PROJECT }}
    steps:
      - uses: actions/checkout@v4
        with:
          # (not the owner's source packs: gigabytes the game doesn't use; the tests and the
          # exports need only the converted assets. Blobs fetched as the checkout needs them.)
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/shotgun-rally/assets/car_packages/
            !/shotgun-rally/assets/environment_packages/user_sources/
      - name: Install Godot + export templates
        run: |
          curl -sSL -o "$RUNNER_TEMP/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          curl -sSL -o "$RUNNER_TEMP/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" \
            templates/windows_release_x86_64.exe templates/linux_release.x86_64 templates/linux_release.arm64 \
            templates/web_nothreads_release.zip templates/macos.zip templates/version.txt -d "$T"
      # The auto-updater (scripts/net/updater.gd): the game knows its build number,
      # and its "base": a fingerprint of what an update pack can't change (the
      # engine, project.godot, the updater itself). Same base -> players get the
      # new build as a pack; a new base -> the game offers the download page.
      - name: Stamp the build number
        run: |
          BASE="$(cat project.godot scripts/net/updater.gd | sha256sum | cut -c1-16)-godot${GODOT_VERSION}"
          echo "UPDATE_BASE=$BASE" >> "$GITHUB_ENV"
          sed -i '/^\[application\]/a config/version="'"$GITHUB_RUN_NUMBER"'"\nconfig/update_base="'"$BASE"'"' project.godot
          sed -n '/^\[application\]/,/^\[/p' project.godot
      - name: Export
        run: |
          G="$RUNNER_TEMP/godot"
          "$G" --headless --path . --import || true
          mkdir -p build/windows build/linux build/linux_arm64 build/macos build/web
          "$G" --headless --path . --export-release "Windows"
          "$G" --headless --path . --export-release "Linux"
          "$G" --headless --path . --export-release "Linux ARM64"
          "$G" --headless --path . --export-release "macOS"
          "$G" --headless --path . --export-release "Web"
          # the update pack: the whole game's content, which every platform's copy loads
          "$G" --headless --path . --export-pack "Linux" build/ShotgunRally.pck
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          pck = "build/ShotgunRally.pck"
          notes = subprocess.run(["git", "log", "-1", "--format=%s"], capture_output=True, text=True).stdout.strip()
          json.dump({"build": int(os.environ["GITHUB_RUN_NUMBER"]), "base": os.environ["UPDATE_BASE"],
                     "sha256": hashlib.sha256(open(pck, "rb").read()).hexdigest(),
                     "size": os.path.getsize(pck), "notes": notes}, open("build/version.json", "w"), indent=1)
          PY
          cat build/version.json
          cd build
          (cd windows && zip -q ../ShotgunRally-Windows.zip ShotgunRally.exe)
          (cd linux && zip -q ../ShotgunRally-Linux.zip ShotgunRally.x86_64)
          # Chromebooks (Linux turned on): a .deb you double-click in Files; most are
          # Intel / AMD, the ARM one is for MediaTek / Snapdragon Chromebooks
          ../tools/make_deb.sh linux/ShotgunRally.x86_64 amd64 "0.1.$GITHUB_RUN_NUMBER" ShotgunRally-Chromebook.deb
          ../tools/make_deb.sh linux_arm64/ShotgunRally.arm64 arm64 "0.1.$GITHUB_RUN_NUMBER" ShotgunRally-Chromebook-ARM.deb
          # the browser version (single-threaded: runs on any web host, itch.io included)
          (cd web && zip -q -r ../ShotgunRally-Web.zip .)
          cp macos/ShotgunRally.zip ShotgunRally-macOS.zip
          python3 ../tools/thin_macos.py macos/ShotgunRally.zip . ShotgunRally
          ls -la
      # One permanent download link per platform: the "shotgun-latest" release always
      # holds the newest build of main under the SAME file names. It's marked
      # pre-release so BAGHOLDERS' "releases/latest" link keeps pointing at BAGHOLDERS.
      - name: Update the "shotgun-latest" download (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          R="$GITHUB_REPOSITORY"
          NOTES="Always the newest SHOTGUN RALLY build.
          Mac: ShotgunRally.zip (older Intel Macs: ShotgunRally-Intel.zip). Unzip, double-click SHOTGUN RALLY.app. The first time macOS says it could not verify it: System Settings -> Privacy & Security -> Open Anyway.
          Windows / Linux: the zips below.
          Chromebook: turn on Linux once (Settings -> About ChromeOS -> Developers -> Linux development environment -> Set up), download ShotgunRally-Chromebook.deb (an ARM Chromebook, MediaTek / Snapdragon: ShotgunRally-Chromebook-ARM.deb), double-click it in Files -> Install, then open SHOTGUN RALLY from the launcher. Online play works. School Chromebooks often have Linux switched off: then the browser version (ShotgunRally-Web.zip, solo play) needs putting on a web host, e.g. itch.io.
          ShotgunRally.pck and version.json are for the game's auto-updater: you don't need to download them."
          if ! gh release view shotgun-latest --repo "$R" > /dev/null 2>&1; then
            gh release create shotgun-latest --repo "$R" --target "$GITHUB_SHA" --title "SHOTGUN RALLY - latest build" --notes "$NOTES" --prerelease --latest=false
          fi
          # runs can finish out of order (a queued older one after a newer one): never
          # put an older build over a newer one
          LIVE=$(gh release download shotgun-latest --repo "$R" --pattern version.json --output - 2>/dev/null \
            | python3 -c "import json, sys; print(int(json.load(sys.stdin)['build']))" 2>/dev/null || echo 0)
          if [ "$LIVE" -gt "$GITHUB_RUN_NUMBER" ]; then
            echo "The download already has build $LIVE, newer than this one ($GITHUB_RUN_NUMBER): leaving it."
            exit 0
          fi
          gh release upload shotgun-latest --repo "$R" --clobber \
            ShotgunRally.zip ShotgunRally-Intel.zip ShotgunRally-Windows.zip ShotgunRally-Linux.zip ShotgunRally.pck \
            ShotgunRally-Chromebook.deb ShotgunRally-Chromebook-ARM.deb ShotgunRally-Web.zip
          # version.json last: the games only see the new build once its pack is there
          # (and a pack that doesn't match version.json's SHA-256 is never used)
          gh release upload shotgun-latest --repo "$R" --clobber version.json
          gh release edit shotgun-latest --repo "$R" --notes "$NOTES" --prerelease --latest=false
      # itch.io: only once the BUTLER_API_KEY secret and the ITCH_PROJECT variable
      # ("your-itch-name/shotgun-rally") are set up. See shotgun-rally/docs/ITCH.md.
      - name: Push to itch.io (main only)
        if: env.BUTLER_API_KEY != '' && env.ITCH_PROJECT != '' && github.ref == 'refs/heads/main'
        run: |
          curl -sSL -o "$RUNNER_TEMP/butler.zip" https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler" && chmod +x "$RUNNER_TEMP/butler/butler"
          V="0.1.${GITHUB_RUN_NUMBER}"
          "$RUNNER_TEMP/butler/butler" push build/ShotgunRally-Windows.zip "$ITCH_PROJECT:windows" --userversion "$V"
          "$RUNNER_TEMP/butler/butler" push build/ShotgunRally-Linux.zip "$ITCH_PROJECT:linux" --userversion "$V"
          "$RUNNER_TEMP/butler/butler" push build/ShotgunRally-macOS.zip "$ITCH_PROJECT:mac-universal" --userversion "$V"
          "$RUNNER_TEMP/butler/butler" push build/web "$ITCH_PROJECT:html5" --userversion "$V"
      - name: Publish a numbered release (tags only)
        if: startsWith(github.ref, 'refs/tags/shotgun-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            shotgun-rally/build/ShotgunRally-Windows.zip
            shotgun-rally/build/ShotgunRally-macOS.zip
            shotgun-rally/build/ShotgunRally.zip
            shotgun-rally/build/ShotgunRally-Intel.zip
            shotgun-rally/build/ShotgunRally-Linux.zip
            shotgun-rally/build/ShotgunRally-Chromebook.deb
            shotgun-rally/build/ShotgunRally-Chromebook-ARM.deb
            shotgun-rally/build/ShotgunRally-Web.zip
