# SHOTGUN RALLY · find where each co-driver word is inside its clip (speech
# recognition), so the clips can be trimmed to just the word. Commits
# shotgun-rally/assets/voice/fraser/spans.json to the same branch.
name: SHOTGUN RALLY · voice word spans

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - shotgun-rally/tools/voice_spans.py

permissions:
  contents: write

jobs:
  spans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recognise the words
        run: |
          pip install --quiet faster-whisper
          python3 shotgun-rally/tools/voice_spans.py
      - name: Commit spans.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shotgun-rally/assets/voice/fraser/spans.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Store the co-driver clips' word spans"
            git push
          fi
