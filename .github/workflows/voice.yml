# New co-driver lines: download the clips listed in assets/voice/fraser/new_clips.json,
# convert them to MP3 and commit them to the branch.
name: SHOTGUN RALLY · store new voice lines

on:
  workflow_dispatch:
  push:
    branches: ["shotgun-rally"]
    paths:
      - assets/voice/fraser/new_clips.json

permissions:
  contents: write
  actions: write

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Download and convert
        run: python3 tools/fetch_voice.py
      - name: Commit the clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/voice/fraser
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Store new co-driver voice lines"
            git push
            # a push made by this workflow doesn't start the build on its own: ask for one
            gh workflow run build.yml --ref shotgun-rally
          fi
        env:
          GH_TOKEN: ${{ github.token }}
